<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 - 가짜 마트 무인 계산대</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 모든 화면 공통 상단 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand-link">가짜 마트</a>
    </div>
  </header>

  <!-- 본문 (가운데 정렬, 최대 너비 960px) -->
  <main class="page-container">
    <!-- 장바구니가 비어 있을 때 보여 주는 안내 -->
    <section id="pay-empty" class="card empty-state-card" hidden>
      <p class="empty-state-message">담은 상품이 없어요</p>
      <a href="scan.html" class="primary-button">계산 화면으로 가기</a>
    </section>

    <!-- 장바구니에 상품이 있을 때 보여 주는 결제 화면 -->
    <section id="pay-content" class="pay-page" hidden>
      <h1 class="page-title">결제</h1>

      <!-- 주문 내역 카드 -->
      <section class="card" aria-label="주문 내역">
        <h2 class="section-title">주문 내역</h2>
        <ul id="pay-item-list" class="order-item-list"></ul>
        <div class="cart-summary">
          <div class="cart-summary-row">
            <span class="cart-meta-label">총 수량</span>
            <strong id="pay-total-qty" class="cart-meta-value">0개</strong>
          </div>
          <div class="cart-summary-row">
            <span class="cart-total-label">합계</span>
            <strong id="pay-total-price" class="cart-total-value pay-total-value">0원</strong>
          </div>
        </div>
      </section>

      <!-- 결제 수단 선택 카드 -->
      <section class="card" aria-label="결제 수단">
        <h2 class="section-title">결제 수단</h2>
        <div id="payment-method-grid" class="payment-method-grid" role="group" aria-label="결제 수단 선택">
          <button type="button" class="payment-method-button" data-method="카드" aria-pressed="false">카드</button>
          <button type="button" class="payment-method-button" data-method="간편결제" aria-pressed="false">간편결제</button>
          <button type="button" class="payment-method-button" data-method="현금" aria-pressed="false">현금</button>
        </div>
      </section>

      <!-- 하단 버튼 -->
      <div class="pay-actions">
        <button id="pay-submit-button" type="button" class="primary-button pay-submit-button" disabled>결제하기</button>
        <a href="scan.html" id="pay-more-link" class="secondary-button pay-more-link">상품 더 담기</a>
      </div>
    </section>
  </main>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/order.js"></script>
  <script src="js/pay.js"></script>
</body>
</html>
