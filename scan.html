<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 계산 - 가짜 마트 무인 계산대</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 모든 화면 공통 상단 헤더 -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand-link">가짜 마트</a>
    </div>
  </header>

  <!-- 본문 (가운데 정렬, 최대 너비 960px) -->
  <main class="page-container">
    <div class="scan-layout">
      <!-- 왼쪽(모바일에서는 위쪽): 카메라 영상, 진행 막대, 인식 상태, 직접 담기 -->
      <section class="card camera-panel" aria-label="카메라 영역">
        <div class="camera-box">
          <video id="scan-video" playsinline muted autoplay></video>
          <!-- 상품이 담겼을 때 1.5초 동안 크게 보여 주는 안내 -->
          <div id="camera-toast" class="camera-toast" role="status" aria-live="polite" hidden></div>
        </div>

        <!-- 후보 유지 시간(0% -> 100%) 진행 막대 -->
        <div
          id="judge-progress-track"
          class="judge-progress-track"
          role="progressbar"
          aria-label="상품 담기 진행률"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="judge-progress-fill" class="judge-progress-fill"></div>
        </div>

        <!-- 인식 상태 한 줄 안내 -->
        <div id="scan-status" class="scan-status" role="status" aria-live="polite">
          모델 불러오는 중...
        </div>

        <!-- 카메라 또는 모델 오류 발생 시 이유와 해결 방법을 보여줍니다. -->
        <section id="scan-error-box" class="error-box" hidden>
          <p id="scan-error-title" class="error-title"></p>
          <p id="scan-error-guide" class="error-guide"></p>
        </section>

        <!-- 인식이 잘 안 되는 상품을 손으로 직접 담는 버튼 목록 -->
        <section class="manual-add-section" aria-label="직접 담기">
          <h2 class="manual-add-title">직접 담기</h2>
          <div id="manual-add-grid" class="manual-add-grid"></div>
        </section>
      </section>

      <!-- 오른쪽(모바일에서는 아래쪽): 장바구니 영역 -->
      <section class="card cart-panel" aria-label="장바구니">
        <div class="cart-header">
          <h1 class="cart-title">장바구니</h1>
          <button id="clear-cart-button" type="button" class="clear-cart-button" hidden>전체 비우기</button>
        </div>

        <div id="cart-empty" class="cart-empty">아직 담은 상품이 없어요</div>

        <ul id="cart-list" class="cart-list" hidden></ul>

        <div class="cart-summary">
          <div class="cart-summary-row">
            <span class="cart-meta-label">총 수량</span>
            <strong id="cart-total-qty" class="cart-meta-value">0개</strong>
          </div>
          <div class="cart-summary-row">
            <span class="cart-total-label">합계</span>
            <strong id="cart-total-price" class="cart-total-value">0원</strong>
          </div>
        </div>

        <!-- 장바구니에 상품이 있을 때만 활성화되며, 누르면 결제 화면(pay.html)으로 이동합니다. -->
        <button id="checkout-button" type="button" class="primary-button checkout-button" disabled>결제하기</button>
      </section>
    </div>
  </main>

  <!-- AGENTS.md 규칙에 따라 고정된 TensorFlow.js 및 Teachable Machine 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/recognizer.js"></script>
  <script src="js/judge.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/scan.js"></script>
</body>
</html>
